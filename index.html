<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SearchX — Explore the sky</title>
  <meta name="description" content="Explore the sky with SearchX.">
  <link rel="stylesheet" href="/landing.css">
</head>
<body><div class="atmosphere" aria-hidden="true"></div><div class="stars" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div><div class="rabbit-art" aria-hidden="true"><div class="rabbit-rim"></div><div class="rabbit-sky"></div><img class="rabbit-figure rabbit-front" src="/rabbits/front.png" alt=""><img class="rabbit-figure rabbit-back" src="/rabbits/back.png" alt=""></div><div class="landing-prompt" aria-label="Tap anywhere to enter the rabbit hole"><h1 class="headline"><span><i>The sky is never still.</i></span></h1><p class="landing-copy">Explore the universe through a different lens.</p><span class="tap-hint">Tap anywhere to enter</span></div>
<section id="choose-path" class="path-choice" aria-labelledby="path-title" tabindex="-1">
  <div class="path-content">
    <header class="path-nav">
      <a class="back-link" id="back-to-entrance" href="#">← Back to entrance</a>

    </header>
        <h2 id="path-title">Which rabbit hole will you take?</h2>
    <p class="path-subtitle">Explore the sky or play today.</p>
    <div class="path-cards">
      <a class="path-card" href="/observatory">
        <span class="tunnel-art explore-tunnel" aria-hidden="true"><span class="tunnel-opening"><i>✦</i><i>·</i><i>✧</i><i>·</i><i>✦</i><b></b></span></span>
        <strong>Explore</strong>
        <small>Follow a clue.</small>
        <span class="path-action">Take the explore path <span>↗</span></span>
      </a>
      <a class="path-card" href="/daily-game" id="daily-game-link">
        <span class="tunnel-art game-tunnel" aria-hidden="true"><span class="tunnel-opening"><i>✦</i><i>·</i><i>✧</i><i>·</i><i>✦</i><b></b></span></span>
        <strong>Daily game</strong>
        <small>One new challenge a day.</small>
        <span class="path-action secondary">Play today <span>↗</span></span>
      </a>
    </div>

  </div>
</section>
<script type="module" src="/landing.js"></script><script type="module" src="/analytics.js"></script></body></html>
