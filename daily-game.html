<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review sky candidates and share your assessment.">
  <title>SearchX — Daily game</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/daily-game.css">
  <script type="module" src="/daily-game.js"></script>
</head>
<body class="game-page">
  <main class="game-app">
    <header class="game-topbar">
      <a class="game-brand" href="/" aria-label="SearchX home">SearchX <span>DAILY GAME</span></a>
      <a class="observatory-return" href="/observatory">Open observatory <span aria-hidden="true">↗</span></a>
    </header>
    <div id="game-status" class="game-status" role="status" aria-live="polite">Loading today's candidate…</div>
    <div id="game-content" hidden>
      <section class="game-panel candidate-panel" aria-labelledby="candidate-title">
        <div class="candidate-progress"><span id="candidate-count"></span><span id="candidate-source"></span></div>
        <div class="candidate-grid">
          <div class="observation-column">
            <div class="observation-frame">
              <img id="candidate-image" alt="SPHEREx observation of the candidate region" hidden>
              <div id="image-placeholder" class="image-placeholder"><span class="placeholder-mark">✦</span><span>Loading sky image…</span></div>
              <button class="frame-control frame-previous" id="frame-previous" type="button" aria-label="Previous observation">‹</button>
              <button class="frame-control frame-next" id="frame-next" type="button" aria-label="Next observation">›</button>
            </div>
            <div class="frame-caption"><span id="frame-label"></span><span id="frame-date"></span></div>
          </div>
          <div class="algorithm-column">
            <div class="algorithm-heading"><img class="game-rabbit" src="/rabbits/front.png" alt=""><div><p class="eyebrow">SIEVE REVIEW</p><h1 id="candidate-title">Candidate</h1></div></div>
            <div class="algorithm-note"><span class="note-label">SIEVE assessment</span><strong id="candidate-verdict" class="candidate-verdict"></strong><p id="candidate-brief" class="candidate-brief"></p><details class="algorithm-details"><summary>Review the evidence</summary><p id="candidate-summary"></p></details></div>
            <div class="algorithm-actions">
              <button class="control-button primary" id="confirm-button" type="button">Confirm</button>
              <button class="control-button" id="challenge-button" type="button">Challenge</button><button class="control-button primary next-candidate" id="next-candidate-top" type="button" hidden>Next candidate</button>
            </div>
            <p class="candidate-meta" id="candidate-position"></p>
            <p id="candidate-result" class="inline-result" aria-live="polite"></p>
          </div>
        </div>
      </section>
      <section class="game-panel challenge-panel" id="challenge-panel" aria-labelledby="challenge-title" tabindex="-1">
        <div class="challenge-observation">
          <div class="challenge-progress"><span id="challenge-count"></span></div>
          <div class="challenge-image-frame"><img id="challenge-image" alt="Current SPHEREx observation" hidden><div class="image-placeholder challenge-placeholder">Candidate image</div></div>
          <div class="frame-caption"><span id="challenge-frame-label"></span><span id="challenge-frame-date"></span></div>
        </div>
        <div class="player-column">
          <div class="player-heading"><img class="game-rabbit player-rabbit" src="/rabbits/front.png" alt=""><div><p class="eyebrow">YOUR TURN</p><h2 id="challenge-title" tabindex="-1">Your assessment</h2></div></div>
          <fieldset class="assessment-fieldset">
            <legend>Does this look like an anomaly?</legend>
            <div class="assessment-options" id="assessment-options"></div>
          </fieldset>
          <fieldset class="confidence-fieldset">
            <legend>How sure are you?</legend>
            <div class="confidence-options" id="confidence-options"></div>
          </fieldset>
          <label class="game-note-label" for="game-note">Your note <span>Optional</span></label>
          <textarea id="game-note" rows="3" maxlength="2000" placeholder="What stands out to you?"></textarea>
          <div class="challenge-actions"><button class="control-button" id="back-to-candidate" type="button">Back</button><button class="control-button primary" id="submit-assessment" type="button">Submit assessment</button><button class="control-button primary next-candidate" id="next-candidate-challenge" type="button" hidden>Next candidate</button></div>
          <p id="challenge-result" class="inline-result" role="status" aria-live="polite"></p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
